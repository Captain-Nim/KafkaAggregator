spring:
  application:
    name: kafka-aggregation-service

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/arnabdb?currentSchema=test
    username: arnab
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kafka-aggregation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: "*"

    # Topics to consume (comma-separated)
    topics: sensor-data-1,sensor-data-2,sensor-data-3

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
  show-actuator: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.kafkaaggregation: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Custom Application Properties
app:
  kafka:
    topics:
      - name: sensor-data-1
        location: Building-A
      - name: sensor-data-2
        location: Building-B
      - name: sensor-data-3
        location: Building-C